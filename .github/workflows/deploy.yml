name: Build and push to GHCR

# This workflow is what puts the robot on the server: it builds deploy/Dockerfile
# and publishes it to GHCR, where the Dokploy app pulls it from. The build's
# ea-check stage compiles MQL4/Experts/HEX-FVG-Breaker.mq4 with the real
# MetaEditor, so a commit whose MQL4 does not compile cannot produce an image -
# "deployed" and "compiles" cannot drift apart.
on:
  push:
    branches:
      - main
    paths:
      - "MQL4/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forex-hex-mt4

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      env_tag: ${{ steps.tag.outputs.env_tag }}
    steps:
      # main -> live | other branches keep their own name. The commit SHA is
      # tagged on every image as well, so a bad deploy can be rolled back by SHA.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env_tag=live" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # MT4_DISTRO_URL is a repository *variable*, not a secret: it is a URL.
      # Unset, the image ships without MetaQuotes' binaries and the container
      # either seeds a distro from the volume or installs its own terminal.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MT4_DISTRO_URL=${{ vars.MT4_DISTRO_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.env_tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=mt4-${{ needs.meta.outputs.env_tag }}
          cache-to: type=gha,mode=max,scope=mt4-${{ needs.meta.outputs.env_tag }}

  # Optional immediate deploy. Two ways to ask Dokploy to pull the new :live, both
  # a no-op notice when unset - a published image is still a usable result, and
  # Dokploy can deploy on demand from its own UI.
  #
  #   API      vars.DOKPLOY_URL + vars.DOKPLOY_COMPOSE_ID + secrets.DOKPLOY_API_TOKEN
  #            -> POST /api/compose.deploy with the x-api-key header. This is
  #            Dokploy's documented CI path (docs.dokploy.com, "Auto Deploy"),
  #            and the only one that does not care what the app's source type,
  #            branch or Watch Paths are set to.
  #   webhook  secrets.DOKPLOY_WEBHOOK, the URL in the app's Deployments tab.
  #            Dokploy reads that URL as a git-provider push, and its handler
  #            (apps/dokploy/pages/api/deploy/compose/[refreshToken].ts) compares
  #            body.ref against the app's branch and looks for
  #            commits[].{added,modified,removed} for Watch Paths - so the body
  #            below has to look like a real push or the deploy is refused with
  #            301 "Branch Not Match". Watch Paths must stay unset for this path
  #            to work, because CI here has no changed-file list to send.
  #
  # Neither is needed if the app is sourced from GitHub through Dokploy's own
  # GitHub App: that integration deploys on push with no configuration at all.
  deploy:
    needs: [meta, image]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.env_tag }}
        run: |
          set -euo pipefail
          if [ -n "${DOKPLOY_URL:-}" ] && [ -n "${COMPOSE_ID:-}" ] && [ -n "${API_TOKEN:-}" ]; then
            echo "Dokploy API: deploying compose ${COMPOSE_ID}"
            body="$(printf '{"composeId":"%s","title":"%s","description":"%s"}' \
                      "$COMPOSE_ID" "GHCR forex-hex-mt4 ${TAG}" "${REPO}@${SHA}")"
            curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
              -H 'accept: application/json' \
              -H 'Content-Type: application/json' \
              -H "x-api-key: ${API_TOKEN}" \
              -d "$body"
            echo "Dokploy triggered for ${IMAGE_NAME}:${TAG}"
            exit 0
          fi
          if [ -n "${WEBHOOK:-}" ]; then
            echo "Dokploy webhook: deploying from the push payload"
            body="$(printf '{"ref":"%s","repository":{"full_name":"%s"},"commits":[],"head_commit":{"id":"%s","message":"%s"}}' \
                      "$REF" "$REPO" "$SHA" "GHCR forex-hex-mt4 ${TAG}")"
            curl -fsS -X POST "$WEBHOOK" \
              -H 'accept: application/json' \
              -H 'Content-Type: application/json' \
              -H 'x-github-event: push' \
              -d "$body"
            echo "Dokploy triggered for ${IMAGE_NAME}:${TAG}"
            exit 0
          fi
          echo "No DOKPLOY_API_TOKEN+DOKPLOY_COMPOSE_ID and no DOKPLOY_WEBHOOK - skipping the deploy trigger."
          echo "Image published: ${IMAGE_NAME}:${TAG}"
