name: Build and push to GHCR

# This workflow is what puts the robot on the server: it builds deploy/Dockerfile
# and publishes it to GHCR, where the Dokploy app pulls it from. The build's
# ea-check stage compiles MQL5/Experts/HEX-BoomRider.mq5 with the real
# MetaEditor, so a commit whose MQL5 does not compile cannot produce an image -
# "deployed" and "compiles" cannot drift apart.
on:
  push:
    branches:
      - main
    paths:
      - "MQL5/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forex-hex-mt5

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      env_tag: ${{ steps.tag.outputs.env_tag }}
    steps:
      # main -> live | other branches keep their own name. The commit SHA is
      # tagged on every image as well, so a bad deploy can be rolled back by SHA.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env_tag=live" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  # The shell logic between the interesting steps: mt5.ini's contents, the log
  # mirror reporting a line once, the healthcheck failing when it should, the
  # compose file resolving into one service, and dokploy-apply.sh against
  # stand-ins. None of that is visible to the image build, and it used to be a
  # script run by hand on one machine. Now a red check stops the push instead of
  # reaching the server.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: selftest
        run: deploy/scripts/selftest.sh

  image:
    needs: [meta, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # MT5_DISTRO_URL is a repository *variable*, not a secret: it is a URL.
      # Unset, the image ships without MetaQuotes' binaries and the container
      # seeds its terminal from the volume instead.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MT5_DISTRO_URL=${{ vars.MT5_DISTRO_URL }}
            HEX_BUILD=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.env_tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=mt5-${{ needs.meta.outputs.env_tag }}
          cache-to: type=gha,mode=max,scope=mt5-${{ needs.meta.outputs.env_tag }}


  # Deploy. The server side is a script, not a click: deploy/scripts/dokploy-apply.sh
  # finds or creates the Dokploy project, finds or creates the Compose app, pushes
  # deploy/docker-compose.yml into it as a raw compose file, writes the environment
  # and deploys. It is idempotent, so running it on every push is safe, and
  # deploy/scripts/selftest.sh exercises it against a stand-in for the API.
  #
  # Unset DOKPLOY_URL / DOKPLOY_API_TOKEN is a notice rather than a failure: a
  # published image is still a usable result, and a fork should not need a token
  # before it can build.
  dokploy:
    needs: [meta, image]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What deploy/docker-compose.yml interpolates - MINUS the account
      # credentials, which deliberately have no GitHub counterpart. MT5_LOGIN /
      # MT5_PASSWORD are set once in the app's Environment tab in Dokploy and
      # dokploy-apply.sh merges (never replaces) the stored environment, so they
      # survive every CI push. This step only keeps the moving parts current:
      # the image tag of this exact build, the distro URL, the desktop switch.
      - name: Write the environment
        env:
          ENABLE_VNC: ${{ vars.ENABLE_VNC }}
          TZ_NAME: ${{ vars.TZ }}
          MT5_DISTRO_URL: ${{ vars.MT5_DISTRO_URL }}
          MT5_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.env_tag }}
        run: |
          set -euo pipefail
          {
            echo "ENABLE_VNC=${ENABLE_VNC}"
            echo "TZ=${TZ_NAME}"
            echo "MT5_DISTRO_URL=${MT5_DISTRO_URL}"
            echo "MT5_IMAGE=${MT5_IMAGE}"
          } > "$RUNNER_TEMP/dokploy.env"

      - name: Provision and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_PROJECT: ${{ vars.DOKPLOY_PROJECT }}
          DOKPLOY_APP: ${{ vars.DOKPLOY_APP }}
          DOKPLOY_ENV_FILE: ${{ runner.temp }}/dokploy.env
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_URL}" ] || [ -z "${DOKPLOY_API_TOKEN}" ]; then
            echo "::notice title=Dokploy::DOKPLOY_URL or DOKPLOY_API_TOKEN is unset - image published, nothing deployed."
            echo "Image published: ${IMAGE_NAME}:${{ needs.meta.outputs.env_tag }}"
            exit 0
          fi
          deploy/scripts/dokploy-apply.sh
