name: Build and push to GHCR

# This workflow is what puts the robot on the server: it builds deploy/Dockerfile
# and publishes it to GHCR, where the Dokploy app pulls it from. The build's
# ea-check stage compiles MQL4/Experts/HEX-FVG-Breaker.mq4 with the real
# MetaEditor, so a commit whose MQL4 does not compile cannot produce an image -
# "deployed" and "compiles" cannot drift apart.
on:
  push:
    branches:
      - main
    paths:
      - "MQL4/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forex-hex-mt4

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      env_tag: ${{ steps.tag.outputs.env_tag }}
    steps:
      # main -> live | other branches keep their own name. The commit SHA is
      # tagged on every image as well, so a bad deploy can be rolled back by SHA.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env_tag=live" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # MT4_DISTRO_URL is a repository *variable*, not a secret: it is a URL.
      # Unset, the image ships without MetaQuotes' binaries and the container
      # either seeds a distro from the volume or installs its own terminal.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MT4_DISTRO_URL=${{ vars.MT4_DISTRO_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.env_tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=mt4-${{ needs.meta.outputs.env_tag }}
          cache-to: type=gha,mode=max,scope=mt4-${{ needs.meta.outputs.env_tag }}

  # Optional immediate deploy. Without DOKPLOY_WEBHOOK set this is a no-op notice:
  # a published image is still a usable result, and Dokploy can pull it on demand.
  deploy:
    needs: [meta, image]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.meta.outputs.env_tag }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DOKPLOY_WEBHOOK is not set - skipping the deploy trigger."
            echo "Image published: ${IMAGE_NAME}:${TAG}"
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            -d "{\"head_commit\":{\"id\":\"${SHA}\",\"message\":\"GHCR forex-hex-mt4 ${TAG}\"}}"
          echo "Dokploy triggered for ${IMAGE_NAME}:${TAG}"
