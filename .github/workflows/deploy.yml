name: Build and push to GHCR

# This workflow is what puts the robot on the server: it builds deploy/Dockerfile
# and publishes it to GHCR, where the Dokploy app pulls it from. The build's
# ea-check stage compiles MQL4/Experts/HEX-FVG-Breaker.mq4 with the real
# MetaEditor, so a commit whose MQL4 does not compile cannot produce an image -
# "deployed" and "compiles" cannot drift apart.
on:
  push:
    branches:
      - main
    paths:
      - "MQL4/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forex-hex-mt4

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      env_tag: ${{ steps.tag.outputs.env_tag }}
    steps:
      # main -> live | other branches keep their own name. The commit SHA is
      # tagged on every image as well, so a bad deploy can be rolled back by SHA.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env_tag=live" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # MT4_DISTRO_URL is a repository *variable*, not a secret: it is a URL.
      # Unset, the image ships without MetaQuotes' binaries and the container
      # either seeds a distro from the volume or installs its own terminal.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MT4_DISTRO_URL=${{ vars.MT4_DISTRO_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.env_tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=mt4-${{ needs.meta.outputs.env_tag }}
          cache-to: type=gha,mode=max,scope=mt4-${{ needs.meta.outputs.env_tag }}

  # Deploy. The server side is a script, not a click: deploy/scripts/dokploy-apply.sh
  # finds or creates the Dokploy project, finds or creates the Compose app, pushes
  # deploy/docker-compose.yml into it as a raw compose file, writes the environment
  # and deploys. It is idempotent, so running it on every push is safe, and
  # deploy/scripts/selftest.sh exercises it against a stand-in for the API.
  #
  # Unset DOKPLOY_URL / DOKPLOY_API_TOKEN is a notice rather than a failure: a
  # published image is still a usable result, and a fork should not need a token
  # before it can build.
  dokploy:
    needs: [meta, image]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The values deploy/docker-compose.yml interpolates. Blank values fall
      # through to that file's defaults (`${VAR:-default}`); MT4_LOGIN and
      # MT4_PASSWORD are the two with `:?` guards, so a deploy missing them fails
      # loudly instead of starting a container that idles without trading.
      # MT4_IMAGE is the exact tag this run published, so the compose file never
      # has to hardcode an owner and a rollback can pin a SHA.
      - name: Write the environment
        env:
          MT4_LOGIN: ${{ secrets.MT4_LOGIN }}
          MT4_PASSWORD: ${{ secrets.MT4_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          MT4_SERVER: ${{ vars.MT4_SERVER }}
          MT4_SYMBOL: ${{ vars.MT4_SYMBOL }}
          MT4_PRESET: ${{ vars.MT4_PRESET }}
          MT4_PROFILE: ${{ vars.MT4_PROFILE }}
          ENABLE_VNC: ${{ vars.ENABLE_VNC }}
          TZ_NAME: ${{ vars.TZ }}
          MT4_DISTRO_URL: ${{ vars.MT4_DISTRO_URL }}
          MT4_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.env_tag }}
        run: |
          set -euo pipefail
          umask 077                     # it holds two secrets
          {
            echo "MT4_LOGIN=${MT4_LOGIN}"
            echo "MT4_PASSWORD=${MT4_PASSWORD}"
            echo "MT4_SERVER=${MT4_SERVER}"
            echo "MT4_SYMBOL=${MT4_SYMBOL}"
            echo "MT4_PRESET=${MT4_PRESET}"
            echo "MT4_PROFILE=${MT4_PROFILE}"
            echo "ENABLE_VNC=${ENABLE_VNC}"
            echo "VNC_PASSWORD=${VNC_PASSWORD}"
            echo "TZ=${TZ_NAME}"
            echo "MT4_DISTRO_URL=${MT4_DISTRO_URL}"
            echo "MT4_IMAGE=${MT4_IMAGE}"
          } > "$RUNNER_TEMP/dokploy.env"

      - name: Provision and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_PROJECT: ${{ vars.DOKPLOY_PROJECT }}
          DOKPLOY_APP: ${{ vars.DOKPLOY_APP }}
          DOKPLOY_ENV_FILE: ${{ runner.temp }}/dokploy.env
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_URL}" ] || [ -z "${DOKPLOY_API_TOKEN}" ]; then
            echo "::notice title=Dokploy::DOKPLOY_URL or DOKPLOY_API_TOKEN is unset - image published, nothing deployed."
            echo "Image published: ${IMAGE_NAME}:${{ needs.meta.outputs.env_tag }}"
            exit 0
          fi
          deploy/scripts/dokploy-apply.sh

