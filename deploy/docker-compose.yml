# HEX-BoomRider on a server: one account, one instrument, one image, one file.
#
# This is the DEFAULT Dokploy route (DEPLOY.md §2): one Compose application, one
# service, one container - the MT4 stack (its containers, volumes and EA) was
# retired and must not come back. The old MT4 service names and instance numbers
# are gone on purpose: the MT5 volume is fresh, claimed by instance 1 with the
# new account.
#
#   service    instance   account               symbol          hostname
#   ---------  ---------  --------------------- --------------  ------------------
#   mt5-boom   1          MT5_LOGIN (Deriv)     Volatility Boom 400 Index  boom.thami.dev
#
# CI pushes this file: deploy/scripts/dokploy-apply.sh creates the Dokploy app,
# sends this YAML to it as a raw compose file, sets the environment and deploys -
# so the server runs exactly the file in the commit. Nothing is built on the
# server; the image is pulled from GHCR.
#
# Everything the service must never disagree about with itself.
x-mt5-common: &mt5-common
  image: ${MT5_IMAGE:-ghcr.io/thamitshepe/forex-hex-mt5:live}
  # Every deploy has to re-pull: :live is a moving tag and `up -d` against an
  # image that is already present does nothing, so the container would come back
  # on the old build and look like a successful deploy of the new one.
  pull_policy: always
  restart: unless-stopped
  # MetaTrader flushes its journals and the EA's CSVs on the way out, so it gets
  # a real window to close instead of being killed on the spot.
  stop_grace_period: 30s
  # Wine on some kernels needs ptrace to attach to the processes it spawns, and
  # MetaTrader loads the EA in-process. This is the difference between "expert
  # loaded successfully" and an EA that silently never attaches.
  cap_add:
    - SYS_PTRACE
  # Xvfb and Wine share memory to draw windows. Too small a /dev/shm shows up as
  # "BadAccess (MIT-SHM)" and a dead desktop.
  shm_size: 512m
  # Dokploy's Traefik proxy lives on `dokploy-network`; a service that is not on
  # it is unreachable by hostname.
  networks:
    - dokploy-network
  # The port the service serves noVNC + websockify on - the number to type into
  # a domain's "container port". Not published anywhere by itself.
  expose:
    - "6080"

services:
  mt5-boom:
    <<: *mt5-common
    environment:
      MT5_INSTANCE: "1"
      MT5_LOGIN: "${MT5_LOGIN:-}"
      MT5_PASSWORD: "${MT5_PASSWORD:-}"
      MT5_SERVER: "${MT5_SERVER:-Deriv-Demo}"
      # Deriv's Boom indices carry the Volatility prefix: the exact symbol name
      # on the account is "Volatility Boom 400 Index". It has to match the
      # broker's symbol to the character - a name that does not exist opens a
      # chart that never synchronizes, and MT5 then deletes the expert after
      # five minutes without ever running it.
      MT5_SYMBOL: "${MT5_SYMBOL:-Volatility Boom 400 Index}"
      MT5_PERIOD: "${MT5_PERIOD:-M15}"
      MT5_EXPERT: "${MT5_EXPERT:-HEX-BoomRider}"
      MT5_PRESET: "${MT5_PRESET:-HEX-BoomRider}"
      # A portable MT5 terminal tarball prepared from a broker MT5 install
      # (deploy/scripts/prepare-distro.sh). Takes precedence when both are set.
      # The frozen portable MT5 tree (release asset, 112MB, sha256-pinned notes).
      # CI ALSO bakes a compiled HEX-BoomRider.ex5 from it into the image, so the
      # runtime never has to compile anything - and never has to install from
      # MetaQuotes' installer at all. Leave it; it is the guaranteed path.
      MT5_DISTRO_URL: "${MT5_DISTRO_URL:-https://github.com/thamitshepe/Forex-hex-algo-strategy-mt4/releases/download/mt5-portable-distro/mt5-portable.tar.gz}"
      # The full MetaTrader 5 installer (verified live, 23.8MB): the container
      # runs it under Wine with /auto and copies the tree into the volume, so a
      # fresh volume needs no tarball at all. Note the tree carries MetaQuotes'
      # server list - if Deriv-Demo is not in it, add the server once through
      # File -> Open an Account on the VNC desktop.
      MT5_SETUP_URL: "${MT5_SETUP_URL:-https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe}"
      MT5_FORCE_SEED: "${MT5_FORCE_SEED:-0}"
      # Where the pushes go: an ntfy topic URL (install the ntfy app and
      # subscribe to the same topic). The CONTAINER sends them with curl - MT5's
      # own WebRequest would need a URL whitelisted by hand in the terminal GUI,
      # which a headless box must not depend on. Empty = no pushes, and the boot
      # log says so.
      MT5_NOTIFY_URL: "${MT5_NOTIFY_URL:-}"
      # One-shot account move for an EXISTING volume: set to 1 in the app's
      # Environment tab when /data/.hex-instance names the old account and the
      # login above is the new one. Unset again after the next start.
      MT5_RECLAIM_VOLUME: "${MT5_RECLAIM_VOLUME:-}"
      ENABLE_VNC: "${ENABLE_VNC:-1}"
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      TZ: "${TZ:-UTC}"
      # Both limits are about the EA's status line, and they answer two different
      # questions (2026-11-02: the chart stopped being ticked at 21:54 while the
      # terminal stayed up, so the EA was never called again and the container read
      # "unhealthy" for six hours with the wrong explanation).
      #   HEX_HEARTBEAT_MAX_AGE_MIN - how stale the line may be before the EA is
      #     considered gone. The EA writes it from a terminal TIMER, so it should
      #     keep moving regardless of ticks.
      #   HEX_TICK_STALL_MIN - how long the chart may go without a tick while the
      #     EA is still writing it. Boom indices are 24/7, so this is a fault: the
      #     entrypoint's alert_watcher sends ONE offline alert and restarts the
      #     terminal after it (3 tries, budget on the volume), and the healthcheck
      #     reports it.
      #   HEX_SILENCE_MIN - how long the line may be stale before the EA is judged
      #     to be off the chart and the terminal restarted to put it back (3 tries,
      #     budget on the volume, then one NEEDS-YOU).
      #   HEX_SILENCE_GRACE_MIN - the head start a freshly booted terminal gets
      #     before any of that, because the container a restart kills leaves an old
      #     line on the volume.
      # None of these notify anything by themselves: they feed ONE alert per state
      # CHANGE (online / offline:<why> / blown), never a notification per minute.
      HEX_HEARTBEAT_MAX_AGE_MIN: "180"
      HEX_TICK_STALL_MIN: "${HEX_TICK_STALL_MIN:-15}"
      HEX_SILENCE_MIN: "${HEX_SILENCE_MIN:-20}"
      HEX_SILENCE_GRACE_MIN: "${HEX_SILENCE_GRACE_MIN:-10}"
      # How long an unchanged outage stays quiet before it is repeated as a single
      # STILL-OFFLINE reminder (0 = never: the phone hears about an outage once,
      # when it starts, and once when it ends). The same window dedupes repeated
      # ERROR/SKIP rows, which the EA writes on every tick while a broker keeps
      # refusing something - that was the "a notification every other second".
      HEX_ALERT_REPEAT_HOURS: "${HEX_ALERT_REPEAT_HOURS:-6}"
      # What counts as a crash loop: this many STARTS inside this many minutes
      # means the terminal is dying seconds after it comes up. alert_watcher
      # cannot see that - its first pass is a minute away and a boot is not a
      # state change - so the boots themselves are counted (on the volume) and the
      # phone gets ONE CRASHLOOP, quoting the last thing the terminal wrote, per
      # HEX_ALERT_REPEAT_HOURS.
      HEX_CRASHLOOP_BOOTS: "${HEX_CRASHLOOP_BOOTS:-3}"
      HEX_CRASHLOOP_WINDOW_MIN: "${HEX_CRASHLOOP_WINDOW_MIN:-10}"
      # The phone side has a quota - ntfy.sh rate-limits a visitor and answers
      # 429 - and a container that restarts in a loop spends it: the same title
      # now goes out at most once per this many seconds, and trade events are
      # never held. 0 disables the window.
      HEX_PUSH_REPEAT_SEC: "${HEX_PUSH_REPEAT_SEC:-300}"
    volumes:
      # Fresh MT5 volume. The old MT4 volumes (hex-mt4-data, hex-mt4-doge-data)
      # are no longer referenced and can be removed on the server once their
      # contents are no longer wanted.
      - hex-mt5-boom-data:/data

volumes:
  hex-mt5-boom-data:

networks:
  dokploy-network:
    external: true
