# HEX-FVG-Breaker on a server: two accounts, two strategies, one image, one file.
#
# This is the ONE-DEPLOY alternative to the default Dokploy route (two Docker-Image
# applications from this same image, DEPLOY.md §6). Both pull
# ghcr.io/thamitshepe/forex-hex-mt4:live; nothing here is built. Choose one route per
# hostname - this file is a Compose application that runs both services:
#
#   service    instance   account                     symbol      hostname
#   ---------  ---------  --------------------------  ----------  -------------------
#   mt4        1          MT4_LOGIN  (MetaQuotes)     XAUUSD M15  trade.thami.dev
#   mt4-doge   2          MT4_LOGIN2 (its own)        DOGEUSD M5  trade2.thami.dev
#
# One deploy brings up both. One Environment tab feeds both. One domain per
# service is the only per-service thing in Dokploy (Domains tab), and the instance
# number is a property of the *service*, not of the env - which is the point: two
# applications hand-configured from one env file is how you end up looking at the
# gold account on both hostnames.
#
# The rule that makes it safe is in the two environment blocks below: instance 1
# is handed MT4_LOGIN and instance 2 is handed MT4_LOGIN2 *and never the plain
# name*. So the DOGE container does not possess the gold credentials at all - not
# "uses them only if MT4_INSTANCE is wrong", does not have them. The entrypoint
# enforces the rest: instance 2 refuses to boot without its own values
# (check_instance_env), a volume claimed by another instance is refused
# (claim_volume), and instance 2's first boot strips the previous account's saved
# login out of the copied terminal (neutralise_seed).
#
# Two things still have to be true before either instance trades:
#   1. the container can log in (MT4_LOGIN / MT4_LOGIN2 and the server name)
#   2. MetaTrader has the ntfy URL on its WebRequest allow-list, and AutoTrading
#      on - see DEPLOY.md, "the one look you have to take"
#
# CI pushes this file: deploy/scripts/dokploy-apply.sh creates the Dokploy app,
# sends this YAML to it as a raw compose file, sets the environment and deploys -
# so the server runs exactly the file in the commit. Nothing is built on the
# server; the image is pulled from GHCR.

# Everything both services must never disagree about. The two service blocks below
# differ only in the lines marked "instance 1" / "instance 2".
x-mt4-common: &mt4-common
  image: ${MT4_IMAGE:-ghcr.io/thamitshepe/forex-hex-mt4:live}
  # Every deploy has to re-pull: :live is a moving tag and `up -d` against an
  # image that is already present does nothing, so the container would come back
  # on the old build and look like a successful deploy of the new one. Dokploy
  # has a "Pull latest images on deploy" switch that adds `--pull always` to the
  # same command, but it has no API field (compose.pullImages exists on the table
  # and not in compose.update), so setting it there would be the one click left
  # in an otherwise clickless deploy. This is the same flag, in the file.
  pull_policy: always
  restart: unless-stopped
  # MT4 flushes its journal and the EA's CSVs on the way out, so it gets a real
  # window to close instead of being killed on the spot.
  stop_grace_period: 30s
  # Wine on some kernels needs ptrace to attach to the processes it spawns, and
  # MetaTrader loads the EA in-process. This is the difference between "expert
  # loaded successfully" and an EA that silently never attaches.
  cap_add:
    - SYS_PTRACE
  # Xvfb and Wine share memory to draw windows. Too small a /dev/shm shows up as
  # "BadAccess (MIT-SHM)" and a dead desktop.
  shm_size: 512m

services:
  mt4:
    <<: *mt4-common
    ports:
      # noVNC desktop, for the one-time look and for emergencies. It is only as
      # exposed as you make it - an empty VNC_PASSWORD publishes nothing, and
      # DEPLOY.md has the SSH-tunnel option. Instance 2 publishes no host port at
      # all: its desktop is its own hostname (https://trade2.thami.dev/vnc.html),
      # which is also what keeps the two from fighting over 6080.
      - "${HOST_VNC_PORT:-6080}:6080"
    environment:
      # instance 1 - reads the plain names below.
      MT4_INSTANCE: "1"
      MT4_LOGIN: "${MT4_LOGIN:-}"
      MT4_PASSWORD: "${MT4_PASSWORD:-}"
      MT4_SERVER: "${MT4_SERVER:-MetaQuotes-Demo}"
      MT4_SYMBOL: "${MT4_SYMBOL:-XAUUSD}"
      # Empty = keep the profile chart's own timeframe; set it to move that chart
      # onto another one.
      MT4_PERIOD: "${MT4_PERIOD:-}"
      MT4_PRESET: "${MT4_PRESET:-100usd-demo}"
      MT4_PROFILE: "${MT4_PROFILE:-default}"
      # Remote desktop. ENABLE_VNC=0 means no desktop at all; a VNC_PASSWORD that
      # is empty means the entrypoint refuses to publish one. One password for
      # both instances is fine - they are separate containers on separate
      # hostnames.
      ENABLE_VNC: "${ENABLE_VNC:-1}"
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      # Hours in the preset are UTC. Changing this moves the trading window.
      TZ: "${TZ:-UTC}"
      # Optional: a prepared terminal tarball. file:// works, so a distro dropped
      # into the volume is 'file:///data/mt4-portable.tar.gz'.
      MT4_DISTRO_URL: "${MT4_DISTRO_URL:-}"
      HEX_HEARTBEAT_MAX_AGE_MIN: "180"
    volumes:
      # Everything that must survive a redeploy lives here: the terminal, the
      # profile with the chart on it, the compiled EA, and the HEX-Logs CSVs that
      # DEMO-PLAN.md reads. This volume's name predates the second service, so
      # adding mt4-doge does not disturb the gold instance's data.
      - hex-mt4-data:/data

  mt4-doge:
    <<: *mt4-common
    environment:
      # instance 2 - reads the "2" copies, and is deliberately NOT given MT4_LOGIN,
      # MT4_PASSWORD or MT4_SERVER. It cannot log into the gold account because it
      # has never been told about it: the credentials are not in this container's
      # environment at all.
      MT4_INSTANCE: "2"
      MT4_LOGIN2: "${MT4_LOGIN2:-}"
      MT4_PASSWORD2: "${MT4_PASSWORD2:-}"
      MT4_SERVER2: "${MT4_SERVER2:-}"
      MT4_SYMBOL2: "${MT4_SYMBOL2:-DOGEUSD}"
      MT4_PERIOD2: "${MT4_PERIOD2:-5}"
      # A -shadow preset places no orders at all (DryRun=1). Start there for one
      # session, read the broker's real spread out of rejections.csv, then switch
      # to doge-scalp.
      MT4_PRESET2: "${MT4_PRESET2:-doge-scalp-shadow}"
      MT4_PROFILE2: "${MT4_PROFILE2:-default}"
      MT4_EXPERT2: "${MT4_EXPERT2:-}"
      ENABLE_VNC: "${ENABLE_VNC:-1}"
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      TZ: "${TZ:-UTC}"
      MT4_DISTRO_URL: "${MT4_DISTRO_URL:-}"
      HEX_HEARTBEAT_MAX_AGE_MIN: "180"
    volumes:
      # Its own volume, because a shared one means a shared config/accounts.ini -
      # the second container would log in as whoever used it last, which is the
      # exact symptom "both hostnames show the same account". Two terminals
      # writing one MT4 tree also corrupt each other. The entrypoint refuses to
      # start if this volume turns out to belong to another instance.
      - hex-mt4-doge-data:/data

volumes:
  hex-mt4-data:
  hex-mt4-doge-data:

